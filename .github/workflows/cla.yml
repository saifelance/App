name: CLA Assistant

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: ./.github/actions/contributor-assistant
        with:
          path-to-signatures: App/cla.json
          path-to-document: https://github.com/saifelance/App/blob/main/CLA.md
          branch: main
          remote-organization-name: saifelance
          remote-repository-name: App
          suggest-recheck: true
          allowList: |
            snyk-bot
            OSBotify
            os-botify[bot]
            imgbot[bot]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
